<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmark Grove</title><link rel="stylesheet" href="/style.css"></head><body><header><small>PERSONAL KNOWLEDGE LIBRARY</small><h1>Bookmark Grove</h1><p>Save the useful things. Find them when you need them.</p><b id="total">0 saved</b></header><main><section class="box"><h2>Save a resource</h2><form id="add"><input name="url" type="url" placeholder="https://…" required><input name="title" placeholder="Title"><input name="tags" placeholder="Tags, separated by commas"><textarea name="note" placeholder="Why is this worth keeping?"></textarea><button>Save to library</button></form><h2>Ask the library coach</h2><form id="coach"><input name="prompt" placeholder="How can I organize a research library?"><button>Ask</button></form><p id="answer"></p></section><section class="box"><div class="search"><h2>Your library</h2><input id="q" placeholder="Search titles, notes, tags…"></div><div id="list"></div></section></main><script src="/app.js"></script></body></html>
